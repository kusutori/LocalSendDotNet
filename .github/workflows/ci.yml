name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore LocalSendDotNet.slnx
      - run: dotnet format LocalSendDotNet.slnx --no-restore --verify-no-changes
      - run: dotnet build LocalSendDotNet.slnx --no-restore --configuration Release
      - run: dotnet test LocalSendDotNet.slnx --no-build --configuration Release --filter "Skip!=Manual"
      - run: dotnet pack src/LocalSendDotNet.Core/LocalSendDotNet.Core.csproj --no-build --configuration Release --output artifacts
      - run: dotnet restore samples/LocalSendDotNet.Sample/LocalSendDotNet.Sample.csproj --source artifacts --source https://api.nuget.org/v3/index.json
      - run: dotnet build samples/LocalSendDotNet.Sample/LocalSendDotNet.Sample.csproj --no-restore --configuration Release
