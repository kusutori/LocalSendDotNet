name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore LocalSendDotNet.Core.slnx
      - run: dotnet format LocalSendDotNet.Core.slnx --no-restore --verify-no-changes
      - run: dotnet build LocalSendDotNet.Core.slnx --no-restore --configuration Release
      - run: dotnet test LocalSendDotNet.Core.slnx --no-build --configuration Release --filter "Skip!=Manual"
      - run: dotnet pack src/LocalSendDotNet.Core/LocalSendDotNet.Core.csproj --no-build --configuration Release --output artifacts
      - run: dotnet restore samples/LocalSendDotNet.Sample/LocalSendDotNet.Sample.csproj --source "${{ github.workspace }}/artifacts"
      - run: dotnet build samples/LocalSendDotNet.Sample/LocalSendDotNet.Sample.csproj --no-restore --configuration Release

  ui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore src/LocalSendDotNet.App/LocalSendDotNet.App.csproj -p:Platform=x64
      - run: dotnet format src/LocalSendDotNet.App/LocalSendDotNet.App.csproj --no-restore --verify-no-changes
      - run: dotnet build src/LocalSendDotNet.App/LocalSendDotNet.App.csproj --no-restore --configuration Release -p:Platform=x64
